name: Build MEGA 3 Split Rescue

on:
  pull_request:
    paths:
      - 'mega3-split-rescue/**'
      - '.github/workflows/mega3-split-rescue.yml'
  push:
    branches:
      - 'build/mega3-split-rescue-v0.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mega3-split-rescue
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and name APK
        working-directory: mega3-split-rescue
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "MEGA3-Split-Rescue-v0.1-debug.apk"
          sha256sum "MEGA3-Split-Rescue-v0.1-debug.apk" > "MEGA3-Split-Rescue-v0.1-debug.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MEGA3-Split-Rescue-v0.1-debug
          path: |
            mega3-split-rescue/MEGA3-Split-Rescue-v0.1-debug.apk
            mega3-split-rescue/MEGA3-Split-Rescue-v0.1-debug.apk.sha256
          if-no-files-found: error
